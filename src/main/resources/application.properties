spring.application.name=choose-your-vehicle
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:car_market_db}?useSSL=false&allowPublicKeyRetrieval=true&sessionVariables=sql_require_primary_key=OFF
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:140501}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create
spring.jpa.generate-ddl=true
server.port=${PORT:8080}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false


spring.servlet.multipart.enabled=true


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=100MB



server.tomcat.max-parameter-count=1000
server.tomcat.max-http-form-post-size=100MB
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
