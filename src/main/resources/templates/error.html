<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Грешка | FindCar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; }
        .error-card {
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: none;
            background: white;
        }
        .automotive-icon {
            position: relative;
            display: inline-block;
        }
        .warning-badge {
            position: absolute;
            bottom: 0;
            right: -10px;
            font-size: 2.2rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card error-card p-5">
                <div class="mb-4">
                    <div class="automotive-icon">
                        <i class="fas fa-car fa-5x text-secondary animate-bounce"></i>
                        <i class="fas fa-exclamation-triangle warning-badge text-warning"></i>
                    </div>
                </div>

                <h2 class="mb-3 fw-bold text-dark" th:text="${errorTitle != null} ? ${errorTitle} : 'Завихме в грешна посока!'">Завихме в грешна посока!</h2>

                <p class="text-secondary fs-5 mb-4" th:text="${errorMessage != null} ? ${errorMessage} : 'Изглежда пътят, по който се опитвате да преминете, е затворен или не съществува.'">
                    Нещо се обърка по трасето.
                </p>

                <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                    <a href="/" class="btn btn-warning px-4 py-2 fw-bold shadow-sm text-dark">
                        <i class="fas fa-home me-2"></i> Към Началото
                    </a>
                    <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2 fw-bold">
                        <i class="fas fa-arrow-left me-2"></i> Назад
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
